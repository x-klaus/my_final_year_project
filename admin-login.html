<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATBU Transport | Admin Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page admin-auth-page">

  <main class="auth-main auth-main--admin">
    <div class="auth-right auth-right--full">
      <div class="auth-form-container">

        <div class="auth-form-header">
          <div class="admin-auth-badge">🛡️</div>
          <h1>Transport Control</h1>
          <p>Administrator sign-in only. This page is not linked from the public site.</p>
        </div>

        <form class="auth-form" id="adminLoginForm" onsubmit="handleAdminLogin(event)">
          <div class="form-group">
            <label for="adminLoginEmail">Admin Email</label>
            <div class="input-wrapper">
              <span class="input-icon">✉️</span>
              <input
                type="email"
                id="adminLoginEmail"
                name="adminLoginEmail"
                placeholder="admin@atbu.edu.ng"
                autocomplete="username"
                required
                oninput="toggleAdminLoginBtn()"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="adminLoginPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                id="adminLoginPassword"
                name="adminLoginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                oninput="toggleAdminLoginBtn()"
              />
            </div>
          </div>

          <div class="form-error hidden" id="adminLoginError">
            <span>⚠️</span>
            <span id="adminLoginErrorText">Invalid credentials. Please try again.</span>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="adminLoginBtn" disabled style="opacity: 0.5;">
            Sign In
          </button>
        </form>

      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
