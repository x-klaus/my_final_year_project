<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATBU Smart Transport | Bookings</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="dashboard-page" data-auth-role="admin">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="nav-logo-icon">🚌</div>
      <div>
        <div class="nav-logo-text">ATBU Transport</div>
        <div class="nav-logo-sub">Admin Portal</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li><a href="admin-dashboard.html" class="sidebar-link"><span class="sidebar-icon">🏠</span><span>Dashboard</span></a></li>
        <li><a href="admin-live-buses.html" class="sidebar-link"><span class="sidebar-icon">🚌</span><span>Live Bus Status</span></a></li>
        <li><a href="admin-bus-requests.html" class="sidebar-link"><span class="sidebar-icon">🗳️</span><span>Bus Requests</span></a></li>
        <li><a href="admin-bookings.html" class="sidebar-link active"><span class="sidebar-icon">🎫</span><span>Bookings</span></a></li>
        <li><a href="admin-actions.html" class="sidebar-link"><span class="sidebar-icon">⚡</span><span>Quick Actions</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <a href="admin-login.html" class="sidebar-logout" onclick="handleLogout(event)"><span>🚪</span><span>Log Out</span></a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="topbar">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="topbar-left">
        <h1 class="topbar-title">Bookings</h1>
        <span class="topbar-date" id="currentDate"></span>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="user-avatar admin-avatar" id="adminAvatar">TA</div>
          <div class="user-info">
            <span class="user-name" id="adminName">Transport Admin</span>
            <span class="user-role">Administrator</span>
          </div>
        </div>
      </div>
    </header>

    <div class="dashboard-content" id="adminBookingsPage">
      <div class="dashboard-card">
        <div class="card-header">
          <h3 class="card-title">All Bookings</h3>
        </div>

        <div class="admin-bookings-filters">
          <div class="admin-filter-group">
            <label for="adminFilterBus">Filter by bus</label>
            <select id="adminFilterBus" class="form-select" onchange="renderAdminBookingsTodayTable()">
              <option value="all">All buses</option>
            </select>
          </div>
          <div class="admin-filter-group">
            <label for="adminFilterDate">Filter by date</label>
            <input type="date" id="adminFilterDate" class="form-select admin-date-input" onchange="renderAdminBookingsTodayTable()"/>
          </div>
          <button type="button" class="btn btn-ghost-dark btn-sm" onclick="resetAdminBookingFilters()">Reset filters</button>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Passenger</th>
                <th>Bus</th>
                <th>Seat</th>
                <th>Ref</th>
                <th>Date</th>
                <th>Payment</th>
              </tr>
            </thead>
            <tbody id="adminBookingsTodayBody"></tbody>
          </table>
        </div>
        <div class="empty-state hidden" id="adminBookingsTodayEmpty">
          <span class="empty-icon">🎫</span>
          <p id="adminBookingsEmptyText">No bookings match your filters.</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
